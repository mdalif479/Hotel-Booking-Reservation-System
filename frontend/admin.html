<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Amour Hotel</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ADMIN DASHBOARD STYLES */

        body {
            background: #f4f4f4;
        }

        .admin-header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .admin-container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            padding: 40px 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-box h2 {
            color: #d4af37;
        }

        .section-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th, table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        .btn-delete {
            background: red;
            color: white;
            border: none;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        .btn-delete:hover {
            background: darkred;
        }

        .logout-btn {
            background: #d4af37;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            float: right;
            margin-bottom: 20px;
            border-radius: 5px;
        }

    </style>

</head>

<body>

<div class="admin-header">
    <h1>Amour Hotel Admin Dashboard</h1>
</div>

<div class="admin-container">

    <button class="logout-btn" onclick="logoutAdmin()">
        Logout
    </button>

    <!-- STATS -->

    <div class="stats">

        <div class="stat-box">
            <h2 id="totalBookings">0</h2>
            <p>Total Bookings</p>
        </div>

        <div class="stat-box">
            <h2 id="totalUsers">0</h2>
            <p>Registered Users</p>
        </div>

        <div class="stat-box">
            <h2 id="totalRevenue">$0</h2>
            <p>Total Revenue</p>
        </div>

    </div>

    <!-- BOOKINGS -->

    <div class="section-box">

        <h2>Bookings</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Room</th>
                    <th>Nights</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="bookingTable"></tbody>
        </table>

    </div>

    <!-- USERS -->

    <div class="section-box">

        <h2>Users</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="userTable"></tbody>
        </table>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
