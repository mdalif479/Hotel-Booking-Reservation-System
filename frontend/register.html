<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Amour Hotel</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* REGISTER PAGE STYLES */

        body {
            background: url("https://images.unsplash.com/photo-1542314831-068cd1dbfeeb")
            center/cover no-repeat;
            min-height: 100vh;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
        }

        .container-box {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-box {
            width: 100%;
            max-width: 450px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            border-radius: 15px;
            padding: 40px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .form-box h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 32px;
        }

        .form-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            outline: none;
        }

        .form-box button {
            width: 100%;
            padding: 12px;
            background: #d4af37;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .form-box button:hover {
            background: #b89225;
        }

        .link {
            color: #d4af37;
            text-decoration: none;
        }

        .text-center {
            text-align: center;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="overlay"></div>

<div class="container-box">

    <div class="form-box">

        <h2>Create Account</h2>

        <form id="registerForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p class="text-center">
            Already have an account?
            <a href="login.html" class="link">
                Login
            </a>
        </p>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/register.js"></script>

</body>
</html>
