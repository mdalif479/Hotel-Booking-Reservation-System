<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Amour Hotel</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* LOGIN PAGE EXTRA STYLES */

        body {
            background: url("https://images.unsplash.com/photo-1542314831-068cd1dbfeeb")
            center/cover no-repeat;
            min-height: 100vh;
        }

        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
        }

        .login-container {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            border-radius: 15px;
            padding: 40px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 32px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            outline: none;
        }

        .login-box label {
            font-size: 14px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #d4af37;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-box button:hover {
            background: #b89225;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .social-login {
            margin-top: 20px;
            text-align: center;
        }

        .social-login button {
            width: 100%;
            margin-top: 10px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .social-login button:hover {
            background: rgba(255,255,255,0.3);
        }

        .link {
            color: #d4af37;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login-overlay"></div>

<div class="login-container">

    <div class="login-box">

        <h2>Welcome Back</h2>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <div class="login-options">

                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#" class="link">
                    Forgot Password?
                </a>

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="social-login">

            <p>Or login with</p>

            <button>Google</button>
            <button>Facebook</button>

        </div>

        <p style="text-align:center;margin-top:15px;">
            Don't have an account?
            <a href="register.html" class="link">
                Register
            </a>
        </p>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/login.js"></script>

</body>
</html>
